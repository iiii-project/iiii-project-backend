# 後端：Django（LLM 走 .env 設定的外部 API）。不對外開埠，只有前端 nginx 能經由
# 共用的 docker network「iiii-project」以 backend:8000 連進來。
# 前端（nginx + caddy）在 iiii-project-frontend/compose.yaml 另外啟動。
#
# 用法（第一次要先建立共用網路）：
#   docker network create iiii-project
#   docker compose up -d --build
services:
  backend:
    build: .
    restart: always
    env_file: .env
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    networks:
      default:
      iiii-project:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  iiii-project:
    name: iiii-project
    external: true

# 沿用拆分前（原本在 iiii-project-frontend 的 compose 專案裡）的 volume 名稱，
# VM 上既有的資料庫與上傳檔案才會繼續沿用，不會變成一個全新的空 volume。
volumes:
  sqlite_data:
    name: iiii-project-frontend_sqlite_data
  media_data:
    name: iiii-project-frontend_media_data
