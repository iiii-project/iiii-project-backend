[project]
name = "ai-fortune-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.7",
    "django-filter>=25.1",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "opik>=1.8",
    "python-dotenv>=1.1",
    "whitenoise>=6.9",
    # live2d 角色對話引擎（移植自 Open-LLM-VTuber）
    "channels>=4.1",
    "daphne>=4.1",
    # 生產環境開多個 process/replica 時,CHANNEL_LAYERS 需要跨 process 共享狀態才
    # 能正確廣播 WebSocket 訊息(見 config/settings.py 的 REDIS_URL 開關)
    "channels-redis>=4.2",
    "openai>=1.57",
    "pyyaml>=6.0.2",
    "chardet>=5.2.0",
    "loguru>=0.7.2",
    "numpy>=1.26,<2",
    "pydub>=0.25.1",
    "edge-tts>=7.0.0",
    "sherpa-onnx==1.10.46",
    "onnxruntime>=1.20.1",
    "opencc-python-reimplemented>=0.1.7",
    "pysbd>=0.3.4",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
