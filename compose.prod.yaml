# 生產環境用（單台 Azure VM），只含 Django 後端。
# 前端（nginx + caddy）在 iiii-project-frontend/compose.prod.yaml 另外啟動，
# 兩邊透過共用的 docker network「iiii-project」互通（前端 nginx 以 backend:8000 連進來）。
#
# 跟 compose.yaml（本機開發用）的差異：
#   - 不含 llama 服務 —— 生產環境走外部 LLM API，不在機器上跑 llama.cpp
#   - restart 政策改成 always（VM 重開機也要自動長回來）
#   - 不對外開埠，只有前端 nginx 能經由共用網路連進來
#
# 用法（第一次要先建立共用網路）：
#   docker network create iiii-project
#   cd iiii-project-backend
#   docker compose -f compose.prod.yaml up -d --build
services:
  backend:
    build: .
    restart: always
    env_file: .env
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    networks:
      default:
      iiii-project:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  iiii-project:
    name: iiii-project
    external: true

# 沿用拆分前（原本在 iiii-project-frontend 的 compose 專案裡）的 volume 名稱，
# 拆出來之後資料庫與上傳檔案才不會變成一個全新的空 volume。
volumes:
  sqlite_data:
    name: iiii-project-frontend_sqlite_data
  media_data:
    name: iiii-project-frontend_media_data
