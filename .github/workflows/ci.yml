name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run migrations check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: uv run python -m pytest --cov=apps --cov=config --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # CD：test 通過、而且是 push 到 main 才部署（PR 不部署）。
  # 在 VM 上執行本 repo 的 scripts/deploy.sh（只更新、重建後端自己的容器）。
  # 在 repo 的 Settings → Secrets and variables → Actions 設定：
  #   Secrets：VM_HOST、VM_USER、VM_SSH_KEY（私鑰）、VM_PORT（選填，預設 22）
  #   Variables：DEPLOY_ENABLED=true（設好 secrets 後再打開）、
  #              DEPLOY_ROOT（選填，VM 上放兩個 repo 的資料夾，預設 $HOME/iiii-project）
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # 同一個 repo 連續 push 時排隊，不取消進行中的部署（中途砍掉可能留下半套容器）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 30m
          script: |
            ROOT="${{ vars.DEPLOY_ROOT }}"
            ROOT="${ROOT:-$HOME/iiii-project}"
            bash "$ROOT/iiii-project-backend/scripts/deploy.sh"
