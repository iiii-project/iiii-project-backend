# 本機開發用：Django 後端 + llama.cpp。前端在 iiii-project-frontend 另外啟動，
# 兩邊透過共用的 docker network「iiii-project」互通（前端 nginx 以 backend:8000 連進來）。
#
# 用法（第一次要先建立共用網路）：
#   docker network create iiii-project
#   cd iiii-project-backend
#   docker compose up -d --build
services:
  llama:
    build: ./llamacpp
    restart: unless-stopped
    environment:
      LLAMA_HOST: 0.0.0.0
      LLAMA_PORT: 1234
      LLAMA_MODEL: ${LLAMA_MODEL:-}
      LLAMA_MODEL_ALIAS: ${LLAMA_MODEL_ALIAS:-local-model}
    volumes:
      - ./llamacpp:/llamacpp
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cd /llamacpp/llamacpp-linux &&
        ln -sf libggml-base.so.0 libggml-base.so &&
        ln -sf libggml-base.so.0.15.3 libggml-base.so.0 &&
        ln -sf libggml.so.0 libggml.so &&
        ln -sf libggml.so.0.15.3 libggml.so.0 &&
        ln -sf libllama-common.so.0 libllama-common.so &&
        ln -sf libllama-common.so.0.0.9873 libllama-common.so.0 &&
        ln -sf libllama.so.0 libllama.so &&
        ln -sf libllama.so.0.0.9873 libllama.so.0 &&
        ln -sf libmtmd.so.0 libmtmd.so &&
        ln -sf libmtmd.so.0.0.9873 libmtmd.so.0 &&
        sed -i 's/\r$//' start-llama.sh &&
        exec bash start-llama.sh
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:1234/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-1234}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      LLM_BASE_URL: http://llama:1234/v1
      LLM_MODEL: ${LLAMA_MODEL_ALIAS:-local-model}
    depends_on:
      llama:
        condition: service_healthy
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    networks:
      default:
      iiii-project:
        aliases: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  iiii-project:
    name: iiii-project
    external: true

# 沿用拆分前（原本在 iiii-project-frontend 的 compose 專案裡）的 volume 名稱，
# 拆出來之後資料庫與上傳檔案才不會變成一個全新的空 volume。
volumes:
  sqlite_data:
    name: iiii-project-frontend_sqlite_data
  media_data:
    name: iiii-project-frontend_media_data
